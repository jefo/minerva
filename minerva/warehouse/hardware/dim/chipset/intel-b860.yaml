notes:
  vs_z890: |
    B860 — mainstream-чипсет LGA1851. Ключевые отличия от Z890:
    - Нет CPU overclocking (множитель заблокирован)
    - Нет мульти-GPU (x8/x8 bifurcation отсутствует)
    - PCIe 5.0 только от CPU (чипсет — PCIe 4.0)
    - Меньше USB 3.2 Gen2x2 портов (2 vs 5)
    - Меньше high-speed I/O линий (34 vs 48)
    - Сохранён memory overclocking (XMP 8000+)
