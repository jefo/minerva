    socket:
      canonical_dim: dim/socket/{slug}.yaml
      id_format: '{slug}'
      description: Процессорный разъём
      aliases:
        AM4: am4
        AM5: am5
        LGA1700: lga-1700
        LGA1851: lga-1851
      attributes:
        - vendor, type, pin_count
        - compatible_memory, predecessor
        - platform_lifespan
      used_in_marts:
        - compatibility
        - platform
    architecture:
      canonical_dim: dim/architecture/{vendor}-{name}.yaml
      id_format: '{vendor}-{name}'
      description: Микроархитектура
      aliases:
        'Zen 3': amd-zen-3
        'Zen 4': amd-zen-4
        'Zen 5': amd-zen-5
        'Alder Lake': intel-alder-lake
        'Raptor Lake': intel-raptor-lake
        'Arrow Lake': intel-arrow-lake
      attributes:
        - vendor, predecessor, successor, isa, node
        - design
        - cache
        - features, branch_prediction
        - key_improvements
      used_in_marts:
        - engineering
        - competitive
    chipset:
      canonical_dim: dim/chipset/{vendor}-{model}.yaml
      id_format: '{vendor}-{model}'
      description: Чипсет материнской платы
      aliases:
        B650: amd-b650
        B860: intel-b860
        Z790: intel-z790
        Z890: intel-z890
      attributes:
        - vendor, socket
        - pcie, usb, sata_ports
        - overclocking, multi_gpu
        - supported_cpu_generations
      used_in_marts:
        - compatibility
        - platform
    motherboard:
      canonical_dim: dim/motherboard/{vendor}-{model}-{revision}.yaml
      id_format: '{vendor}-{model}-{revision}'
      description: Материнская плата — продуктовая реализация чипсета конкретным вендором
      grain: 'SKU + hardware revision'
      aliases: {}
      attributes:
        - vendor, model, revision, form_factor
        - chipset, socket, bios_version
        - vrm, pcb, memory
        - pcie_slots, m2_slots, sata_ports
        - networking, audio, usb_ports
        - cooling, qol_debug
        - price
      used_in_marts:
        - compatibility
        - platform
        - build-economics
        - narrative
    benchmark_scenario:
      canonical_dim: dim/benchmark_scenario/{slug}.yaml
      id_format: '{slug}'
      description: 'Сценарий бенчмарка (определяет bound: CPU, GPU, synthetic)'
      aliases:
        '1080p Low': 1080p-low
        '1080p low': 1080p-low
        '720p Low': 720p-low
        '720p low': 720p-low
        '1440p Ultra': 1440p-ultra
        'Synthetic 1T': synthetic-1t
        'Cinebench 1T': synthetic-1t
        'Geekbench ST': synthetic-1t
        'Synthetic MT': synthetic-mt
        'Cinebench nT': synthetic-mt
        'Geekbench MT': synthetic-mt
        'Productivity': productivity
        'Blender': productivity
      attributes:
        - category
        - resolution, preset
        - purpose
        - gpu_bound_risk
      used_in_marts:
        - comparison
        - engineering
  facts:
    observation:
      description: Единичный замер производительности в игре
      grain: single_benchmark_run
      mandatory_dimensions:
      - gpu
      - game_title
      - resolution
      - graphics_preset
      - driver_version
      optional_dimensions:
      - cpu
      allowed_measures:
      - fps_avg
      - fps_1pct_low
      - fps_0_1pct_low
      - frametime_ms_avg
      - vram_used_gb
      - power_draw_w_min
      - power_draw_w_max
      - temp_c_min
      - temp_c_max
      - delta_vs_rtx5060_pct
      - delta_vs_rx9060xt_pct
      - fps_current
      - gpu_load_pct
      - vram_used_mb
      - power_draw_w
      - clock_core_mhz
      - clock_mem_mhz
      - temp_c
      - temp_hotspot_c
      - frame_gen_multiplier
      - clock_mhz_min
      - clock_mhz_max
      - vram_used_gb_median
      measure_definitions:
        fps_avg: definitions/average-fps.yaml
        fps_1pct_low: definitions/one-percent-low-fps.yaml
      validation_rules:
      - Не может быть двух Observation с одинаковыми mandatory_dimensions
      - fps_avg должен быть больше fps_1pct_low
    metric:
      description: Аддитивная метрика (TFLOPS, bandwidth, цена)
      grain: single_gpu_spec
      mandatory_dimensions:
      - gpu
      allowed_measures:
      - fp32_tflops
      - bandwidth_gb_s
      - price_rub
    cpu_observation:
      description: Замер производительности CPU в сценарии (игровой бенчмарк или синтетика)
      grain: single_cpu_benchmark_run
      mandatory_dimensions:
        - cpu
        - benchmark_scenario
        - game_title
        - resolution
        - graphics_preset
        - driver_version
      optional_dimensions:
        - gpu
      allowed_measures:
        - fps_avg
        - fps_1pct_low
        - fps_0_1pct_low
        - frametime_ms_avg
        - frametime_ms_p99
        - gpu_utilization_pct
        - cpu_utilization_pct
        - score
        - power_draw_w
        - temp_c
      measure_definitions:
        fps_avg: definitions/average-fps.yaml
        fps_1pct_low: definitions/one-percent-low-fps.yaml
        frametime_ms_p99: definitions/frametime-ms-p99.yaml
        gpu_utilization_pct: definitions/gpu-utilization-pct.yaml
        cpu_utilization_pct: definitions/cpu-utilization-pct.yaml
      validation_rules:
        - Не может быть двух cpu_observation с одинаковыми mandatory_dimensions
        - fps_avg должен быть больше fps_1pct_low
        - Если benchmark_scenario.category == "synthetic", game_title НЕ обязателен
