      - architecture
      - vendor
      - vram.size_gb
      - vram.type
      - vram.bus_width_bit
      - vram.bandwidth_gb_s
      - compute.cuda_cores
      - power.tdp_w
      used_in_marts:
      - coverage
      - engineering
      - competitive
      - narrative
      - compatibility
