bus_matrix:
  domain: hardware
  dimensions:
    gpu:
      canonical_dim: dim/gpu/{vendor}-{model}.yaml
      id_format: '{vendor}-{model}'
      description: Дискретная видеокарта
      scd_default: 0
      aliases:
        Arc B580: arc-b580
        RTX 4060: rtx-4060
        RTX 4060 Ti 8GB: rtx-4060-ti-8gb
        RTX 4070 Super: rtx-4070-super
        RTX 4070 Ti: rtx-4070-ti
        RTX 4070 Ti Super: rtx-4070-ti-super
        RTX 5050: rtx-5050
        RTX 5060: rtx-5060
        RTX 5060 Ti: rtx-5060-ti
        RTX 5060 Ti 16GB: rtx-5060-ti-16gb
        RX 9060 XT: rx-9060-xt
        RX 9060 XT 16GB: rx-9060-xt-16gb
