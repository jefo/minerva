      - competitive
    resolution:
      canonical_dim: dim/resolution/{value}.yaml
      id_format: '{value}'
      description: Разрешение экрана
      canonical_values:
      - 1080p
      - 1440p
      - 4K
      used_in_marts:
      - coverage
      - engineering
      - competitive
    graphics_preset:
      canonical_dim: dim/graphics_preset/{slug}.yaml
      id_format: '{slug}'
      description: Пресет графики
      canonical_values:
      - balanced
      - epic
      - extreme
      - high
      - low
      - max
      - medium
      - optimized
      - ultra
      - ultra-nightmare
      - very-high
      used_in_marts:
      - coverage
    driver_version:
      canonical_dim: dim/driver_version/{vendor}-{branch}-{version}.yaml
      id_format: '{vendor}-{branch}-{version}'
      description: Версия драйвера
      scd_default: 2
      aliases:
        2025-Q1: 2025-q1
        2026-Q2: 2026-q2
        '546.33': '546.33'
        '572.16': '572.16'
        Adrenalin 25.6.1: adrenalin-25.6.1
      used_in_marts:
      - coverage
      - engineering
    cpu:
      canonical_dim: dim/cpu/{vendor}-{model}.yaml
      id_format: '{vendor}-{model}'
      description: Процессор тестового стенда
      used_in_marts:
      - coverage
      - compatibility
  facts:
    observation:
      description: Единичный замер производительности в игре
      grain: single_benchmark_run
      mandatory_dimensions:
      - gpu
      - game_title
      - resolution
      - graphics_preset
      - driver_version
      optional_dimensions:
      - cpu
      allowed_measures:
      - fps_avg
      - fps_1pct_low
      - fps_0_1pct_low
      - frametime_ms_avg
      - vram_used_gb
      - power_draw_w_min
      - power_draw_w_max
      - temp_c_min
      - temp_c_max
      - delta_vs_rtx5060_pct
      - delta_vs_rx9060xt_pct
      - fps_current
      - gpu_load_pct
      - vram_used_mb
      - power_draw_w
      - clock_core_mhz
      - clock_mem_mhz
      - temp_c
      - temp_hotspot_c
      - frame_gen_multiplier
      - clock_mhz_min
      - clock_mhz_max
      - vram_used_gb_median
      measure_definitions:
        fps_avg: definitions/average-fps.yaml
        fps_1pct_low: definitions/one-percent-low-fps.yaml
      validation_rules:
      - Не может быть двух Observation с одинаковыми mandatory_dimensions
      - fps_avg должен быть больше fps_1pct_low
    metric:
      description: Аддитивная метрика (TFLOPS, bandwidth, цена)
      grain: single_gpu_spec
      mandatory_dimensions:
      - gpu
      allowed_measures:
      - fp32_tflops
      - bandwidth_gb_s
      - price_rub
