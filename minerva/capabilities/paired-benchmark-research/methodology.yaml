# Paired CPU×GPU Benchmark Research
# Capability: research/paired-benchmark-research
# Назначение: системный поиск и валидация парных бенчмарков CPU+GPU для modern hardware
# Создано: 2026-07-19
# Статус: active, wave 1 complete (2 CRITICAL pairs)

methodology:
  name: "Paired Benchmark Research Protocol"
  version: "1.0"

  trust_model:
    training_data_cutoff: "Q3 2024"
    trusted_pairs:
      description: "Пары CPU+GPU где ОБА компонента вышли до Q3 2024"
      examples:
        - "Ryzen 7000 + RTX 4000"
        - "Ryzen 7000 + RX 7000"
        - "LGA1700 (12-14th gen) + RTX 4000"
    untrusted_pairs:
      description: "Пары где хотя бы один компонент вышел после Q3 2024 — требуется research"
      examples:
        - "Ryzen 9000 × любой GPU (вышли Aug 2024)"
        - "Core Ultra 200 × любой GPU (вышли Oct 2024 — Jan 2025)"
        - "RTX 5000 × любой CPU (вышли Jan-Mar 2025)"
        - "RX 9000 × любой CPU (вышли Mar 2025)"
        - "Intel Arc B500 × любой CPU (вышли Dec 2024 — Jan 2025)"

  source_ontology:
    sources:
      - type: cpu_scaling_articles
        description: "Один GPU × много CPU — золотой стандарт"
        examples: ["TechSpot CPU Scaling series", "ComputerBase CPU-Skalierung", "Gamers Nexus"]
        search_pattern: 'site:techspot.com "cpu scaling" "{gpu_name}"'
      - type: gpu_reviews
        description: "GPU обзор на флагманском CPU. GN использует 9800X3D как стандартный стенд с 2025."
        examples: ["Gamers Nexus GPU reviews", "TechPowerUp GPU reviews"]
        search_pattern: 'site:gamersnexus.net "{gpu_name}" review'
        note: "GN GPU reviews since late 2024 = paired with 9800X3D by default."
      - type: cpu_reviews
        description: "CPU обзор с топ-GPU (4090/5090)"
        examples: ["GN CPU reviews", "Hardware Unboxed CPU reviews"]
        search_pattern: 'site:gamersnexus.net "{cpu_name}" review'
      - type: roundup_comparison
        description: "Несколько CPU × один GPU сегмент"
        examples: ["TechSpot Best CPU for RTX 4070 Super", "HUB monthly roundups"]
        search_pattern: '"best cpu for" "{gpu_name}"'
      - type: youtube_paired
        description: "YouTube каналы с прямыми paired-замерами"
        examples: ["Testing Games", "Daniel Owen", "Hardware Unboxed"]
        search_pattern: 'youtube "{cpu_name}" "{gpu_name}" benchmark'
      - type: synthetic_computation
        description: "GPU_ceiling × CPU_scaling_factor = estimated FPS"
        confidence: 0.70
        note: "Использовать когда прямой paired-замер не найден"

  search_protocol:
    steps:
      - step: 1
        name: "CPU Review Baseline"
        description: "Найти CPU-обзор с флагманским GPU — это ceiling производительности CPU"
        output: "Gaming FPS на RTX 4090/5090"
      - step: 2
        name: "GPU Scaling Search"
        description: "Найти CPU scaling статью для целевого GPU"
        output: "Один GPU × много CPU в одной статье"
      - step: 3
        name: "Cross-Reference Validation"
        description: "GPU-обзор на флагманском CPU — ceiling GPU"
        output: "GPU FPS на флагманском CPU"
      - step: 4
        name: "Synthetic Computation"
        description: "Если шаги 1-3 не дали paired-замер, вычислить: GPU_ceiling × CPU_scaling_factor"
        output: "Estimated pair FPS (confidence 0.70)"

  priority_matrix:
    description: "Приоритизация связок CPU×GPU для research. Не все×все — сначала самые частые сборки."
    tiers:
      CRITICAL:
        description: "Самые популярные сборки сегодня. Research немедленно."
        pairs:
          - "9800X3D + RTX 5070"
          - "9800X3D + RX 9070 XT"
      HIGH:
        description: "Частые сборки. Research во вторую волну."
        pairs:
          - "7800X3D + RTX 5070"
          - "7800X3D + RX 9070 XT"
          - "9800X3D + RTX 5070 Ti"
          - "9600X + RTX 5070"
          - "9600X + RX 9070 XT"
          - "7600X + RTX 5060 Ti"
          - "7600X + RTX 5070"
          - "245K + RTX 5070"
          - "265K + RTX 5070 Ti"
          - "7600X3D + RX 9070"
      MED:
        description: "Закрываем когда есть данные, не гонимся."
        pairs:
          - "7800X3D + RTX 5080"
          - "9800X3D + RTX 5080"
          - "14900K + RTX 5070"
          - "7800X3D + RTX 5060 Ti"

  data_extraction:
    format: "paired_gpu_observation"
    schema:
      fact:
        id: "{gpu_id}-{cpu_short}-{game}-{resolution}-{preset}-{conditions}"
        type: observation
      source:
        gpu: "human-readable GPU name"
        game_title: "human-readable game name"
        resolution: "1080p | 1440p | 4K"
        graphics_preset: "Ultra | High | Max"
        driver_version: "YYYY-QN"
        cpu: "human-readable CPU name"
      measures:
        fps_avg: integer
        fps_1pct_low: integer  # 0 if unknown
      conditions:
        upscaler: "native | dlss | fsr"
        frame_gen: "true | false"
        ray_tracing: "On | Off"
      meta:
        confidence: 0.70-0.88  # synthetic≤0.70, youtube=0.85, verified_review=0.88
        confidence_basis: "verified_review | youtube_benchmark | synthetic"
        source_url: "URL"
        source_title: "Source Name, Month Year"

