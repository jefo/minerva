# sff_compact_itx_portable
# Домен: Physical (жёсткие геометрические ограничения корпуса и питания)
# 
# ДИРЕКТИВА LLM: все ссылки вида path/to/file.md#section — navigable references.
# Загрузи файл, найди секцию, извлеки конкретику. Без этого расчёты не делать.

uri: "intent#sff_compact_itx_portable"
type: "SystemRequirementsVector"
domain: "physical_constraints"
description: >
  Компактный ПК в корпусе SFF (Small Form Factor) объёмом < 11 литров.
  Физическая собираемость — главный constraint. Жёсткие лимиты: длина GPU,
  высота кулера, форм-фактор БП. Тепловая ловушка малого объёма.

requirements:
  budget_allocation_priority: "Cooling"
  budget_note: "В SFF охлаждение — разрешающий фактор. Плохой кулер → throttling всей системы."
  domain_modules_required: ["pcbo:modules/physical_constraints"]

  constraints:
    max_acceptable_noise_load: "A2"
    max_acceptable_noise_note: "Маленький корпус стоит на столе, в 30–50 см от пользователя. A2 — максимум."
    max_acceptable_thermal_state: "T_Safe"
    max_acceptable_thermal_note: "Малый объём → тепловая ловушка. Throttling в SFF = мгновенный перегрев всего корпуса."
    min_ram_capacity_gb: 32
    min_ram_note: "ITX-платы имеют только 2 слота DDR5. Апгрейд RAM = полная замена планок."
    min_storage_sustained_write: false
    min_storage_note: "SFF-ПК — обычно не сервер. NVMe Gen4 достаточно."

  maut_weights:
    performance_importance: 0.5
    performance_note: "Важно, но физическая собираемость важнее"
    silence_importance: 0.7
    silence_note: "Система на столе — шум критичен"
    thermal_margin_importance: 0.9
    thermal_note: "Малый объём — перегрев убивает производительность полностью"
    upgrade_longevity_importance: 0.3
    longevity_note: "SFF — осознанный компромисс"

profile_interaction_matrix:
  mandatory_steel_man: []
  mandatory_steel_man_note: "SFF не требует специфичных поведенческих профилей. Ограничения — физические."

  strict_block:
    - profile: "concepts/epistemological-profiles.md#enthusiast_unrestricted_gpu"
      reason: "Карты TGP ≥ 280W выделяют 300–500W тепла в корпус < 11L. Температура внутри 55–60°C → перегрев CPU, VRM, SSD. CLIFF_DROP — BLOCK."
    - profile: "concepts/epistemological-profiles.md#transient_spike_heavy"
      reason: "Карты с резкими скачками потребления. SFX-БП имеют меньшие конденсаторы → хуже демпфируют transient spikes. Риск аварийного выключения."

# --- ФИЗИЧЕСКИЕ ОГРАНИЧЕНИЯ ---
# Проверяются через validate_physical_constraints.py (Skill 9).
# Это не поведенческие профили — это бинарные физические предикаты.

physical_constraints:
  gpu_max_length_mm: 320
  gpu_length_note: "Fractal Terra 322mm, FormD T1 330mm, Dan A4-SFX 306mm. 320mm — безопасный максимум."

  gpu_max_thickness_slots: 3.0
  gpu_thickness_note: "3 слота — максимум для большинства SFF-корпусов."

  cooler_max_height_mm: 155
  cooler_height_note: "Fractal Terra 110mm, FormD T1 110mm, Dan C4-SFX 145mm. 155mm — верхняя граница."

  psu_form_factor: "SFX"
  psu_form_factor_note: "ATX (140×150×86mm) не влезает в SFF. Требуется SFX (125×100×63.5mm) или SFX-L."

  mb_form_factor: "ITX"
  mb_form_factor_note: "Только Mini-ITX (170×170mm) или Mini-DTX."

  power_budget_max_w: 750
  power_budget_note: "SFX-БП ограничены мощностью. Corsair SF750 — золотой стандарт. 1000W — единичные модели с премиум-наценкой."
