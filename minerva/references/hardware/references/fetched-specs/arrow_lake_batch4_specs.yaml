# =============================================================================
# СВОДКА КРИТИЧЕСКИХ ЗНАЧЕНИЙ (отличия от training data LLM)
# =============================================================================
critical_verifications:
  pcie_lanes:
    all_models: 24
    llm_training_data_error: 20
    verified_source: "tekhouse.co.uk (225F), villman.com (245K), nabava.net (285K)"

  box_cooler:
    non_k_models: "RM2 (LGA1851)"
    k_models: "none"
    llm_error_rm1: "RM1 = LGA1700 (предыдущее поколение). Arrow Lake использует LGA1851 → RM2"
    verified_source: "https://www.intel.com/content/www/us/en/support/articles/000100172/processors.html"
    rm2_ships_with: ["225", "225F", "235", "265", "265F"]

  e_core_base_vs_turbo:
    note: "Training data LLM часто путает base и all-core turbo для E-cores"
    verified:
      225F: { base: 2.7, max_turbo: 4.4 }
      245K: { base: 3.6, max_turbo: 4.6 }
      265F: { base: 1.8, max_turbo: 4.6 }
      265K: { base: 3.3, max_turbo: 4.6 }
      285K: { base: 3.2, max_turbo: 4.6 }

  tdp_pl2_265f:
    correct_value: 182
    llm_error_value: 121
    note: "LLM копирует PL2=121W с 225F. Реальное значение 265F = 182W."
    verified_source: "astrindostore.com — Maximum Turbo Power: 182 W"
