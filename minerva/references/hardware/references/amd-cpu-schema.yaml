# AMD CPU Schema v1.0.0
# Назначение: эталон структурной полноты для KB-записей AMD CPU.
# Принцип: "лучше 15 узких полей чем одно размытое".

schema:
  vendor: amd
  version: "1.0.0"
  applies_to: "all AMD desktop CPU (AM4, AM5)"

  mandatory:
    identity:
      vendor: amd
      architecture: string
      architecture_generation: integer
      codename: string
      sku: string
      sku_family: string
      release_date: string
      status: string

    core_config:
      total_cores: integer
      total_threads: integer
      smt: boolean
      core_arch: string
      ccd_count: integer
      cores_per_ccd: integer
      ccd_config: string

    cache:
      l1_cache_per_core: string
      l2_per_core: string
      l2_total: string
      l3_per_ccd: string
      l3_total: string
      x3d_present: boolean
      x3d_vcache_size: [string, "null"]
      x3d_generation: [string, "null"]
      x3d_cache_location: [string, "null"]
      x3d_ccd_count: [integer, "null"]

    clocks:
      base_clock: string
      boost_clock_max: string
      fmax_boost: [string, "null"]
      boost_clock_all: [string, "null"]

    power_thermal:
      tdp: string
      ppt: string
      tjmax: string
      typical_gaming_power: [string, "null"]
      eco_mode_available: boolean
      eco_mode_tdp: [string, "null"]

    lithography:
      ccd_node: string
      iod_node: string
      die_topology: string
      transistor_count: [string, "null"]

    platform:
      socket: string
      chipset_generation: string
      memory_type: string
      memory_channels: integer
      memory_max_official: string
      memory_max_practical: [string, "null"]
      jedec_max: string
      expo_max: [string, "null"]
      expo_1to1_max: [string, "null"]

    pcie:
      pcie_version: string
      pcie_lanes_cpu: integer
      pcie_config: string
      pcie_lanes_chipset: [string, "null"]

    igpu:
      igpu_present: boolean
      igpu_arch: [string, "null"]
      igpu_compute_units: [integer, "null"]
      igpu_clock: [string, "null"]
      av1_decode_hw: [boolean, "null"]
      av1_encode_hw: [boolean, "null"]

    npu:
      npu_present: boolean
      npu_generation: [string, "null"]
      npu_tops_int8: [integer, "null"]

    isa_extensions:
      avx512: boolean
      avx512_full_width: boolean
      avx2: boolean
      vnni: boolean

    packaging:
      box_cooler_included: boolean
      box_cooler_model: [string, "null"]
      cooler_recommended: [string, "null"]
      multiplier_locked: boolean
      ihs_soldered: boolean
      curve_optimizer: [string, "null"]

    market:
      msrp_usd_launch: [integer, "null"]
      price_ru_min: [integer, "null"]
      price_ru_median: [integer, "null"]
      price_ru_max: [integer, "null"]
      price_ru_date: [string, "null"]
      price_ru_source: [string, "null"]
      segment: string
      binning_status: string

  conditional:
    x3d:
      applies_when: "x3d_present == true"
      fields:
        x3d_vcache_size: string
        x3d_generation: string
        x3d_cache_location: string
        x3d_thermal_penalty_mhz: [integer, "null"]
        x3d_ccd_count: integer

    dual_ccd:
      applies_when: "ccd_count == 2"
      fields:
        cross_ccd_latency: [string, "null"]
        preferred_ccd_scheduling: [string, "null"]

    apu:
      applies_when: "igpu_compute_units != null AND igpu_compute_units > 2"
      fields:
        igpu_full_name: string
        igpu_rops: [integer, "null"]
        igpu_tmus: [integer, "null"]

  null_semantics:
    not_applicable:
      - when: "x3d_present == false"
        nulls: [x3d_vcache_size, x3d_generation, x3d_cache_location, x3d_thermal_penalty_mhz, x3d_ccd_count]
      - when: "igpu_present == false"
        nulls: [igpu_arch, igpu_compute_units, igpu_clock, av1_decode_hw, av1_encode_hw]
      - when: "ccd_count == 1"
        nulls: [cross_ccd_latency, preferred_ccd_scheduling]

    unchecked:
      - field: "price_ru_median"
        status: "requires pc-parts-price-check"
      - field: "typical_gaming_power"
        status: "requires reviews"

  cross_field_rules:
    - rule: "total_cores == ccd_count * cores_per_ccd"
      severity: BLOCK
    - rule: "total_threads == 2 * total_cores (when smt == true)"
      severity: BLOCK
    - rule: "total_threads == total_cores (when smt == false)"
      severity: BLOCK
    - rule: "socket == 'AM4' AND memory_type == 'DDR5' is IMPOSSIBLE"
      severity: BLOCK
